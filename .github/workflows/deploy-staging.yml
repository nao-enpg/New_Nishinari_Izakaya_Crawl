name: Deploy staging

# staging へのデプロイ。Actions の画面から手動で実行する（自動では動かない）。
# - 「Use workflow from」で選んだブランチを出す。main 以外も出せる（実機での確認など）
#   ただし、そのブランチに D1 のマイグレーションがあると staging の DB に当たり、main に戻しても元に戻らない。
#   マイグレーションを含むブランチは、main に入れてから出す
# - 前提: environment「staging」に secret CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がある
# - 手順の中身は scripts/deploy.sh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: scripts/deploy.sh staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summary
        run: |
          {
            echo "## staging にデプロイした"
            echo
            echo "- コミット: \`$(git rev-parse --short=12 HEAD)\`"
            echo "- ブランチ: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
