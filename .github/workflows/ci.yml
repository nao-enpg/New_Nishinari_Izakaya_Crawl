name: CI

# 検査だけを行う（型チェック・禁止パターン・テスト・ビルド）。デプロイはしない。
# - PR と main への push で自動で動く
# - デプロイのワークフロー（deploy-staging.yml / deploy-production.yml）からも、デプロイの前に呼ばれる（workflow_call）

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      # PR の古い実行だけを取り消す。main とデプロイ前の検査は取り消さない
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-prisma-versions.mjs
      - run: pnpm exec prisma generate
      - run: scripts/check-migrations.sh
      - run: scripts/check-forbidden.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
